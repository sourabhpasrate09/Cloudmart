services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cloudmart_root
      MYSQL_DATABASE: cloudmart
      MYSQL_USER: cloudmart_user
      MYSQL_PASSWORD: change_me
    ports:
      - "3306:3306"
    volumes:
      - cloudmart_mysql:/var/lib/mysql
      - ./database/00_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./database/CloudMart_311_AMAZON_SCREENSHOT.sql:/docker-entrypoint-initdb.d/01_catalog.sql:ro
      - ./database/01_add_payment_columns.sql:/docker-entrypoint-initdb.d/02_payment.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cloudmart
      DB_USER: cloudmart_user
      DB_PASSWORD: change_me
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      API_UPSTREAM: backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  cloudmart_mysql:
