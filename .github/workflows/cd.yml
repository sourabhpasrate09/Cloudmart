
name: CloudMart CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::638175140656:role/CloudMart-GitHubActions-ECR-Role
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build -f docker/backend.Dockerfile -t 638175140656.dkr.ecr.ap-south-1.amazonaws.com/cloudmart-backend:V1.0.0 .
          docker push 638175140656.dkr.ecr.ap-south-1.amazonaws.com/cloudmart-backend:V1.0.0

      - name: Build and push frontend
        run: |
          docker build -f docker/frontend.Dockerfile -t 638175140656.dkr.ecr.ap-south-1.amazonaws.com/cloudmart-frontend:V1.0.0 .
          docker push 638175140656.dkr.ecr.ap-south-1.amazonaws.com/cloudmart-frontend:V1.0.0
